<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Joel Interweb</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #212121;
            color: #ececec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top navigation */

        .navbar {
            height: 64px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #333;
            background: #171717;
        }

        .logo {
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        /* Main content */

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .page {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .page.hidden {
            display: none;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: #10a37f;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            font-weight: 600;
        }

        h1 {
            font-size: 36px;
            line-height: 1.2;
            font-weight: 600;
            margin: 0 0 38px;
            letter-spacing: -0.8px;
        }

        /* Buttons */

        .button-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        button {
            border: 1px solid #444;
            background: #2f2f2f;
            color: #ececec;
            border-radius: 12px;
            padding: 20px 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }

        button:hover {
            background: #3a3a3a;
            border-color: #555;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .primary {
            background: #10a37f;
            border-color: #10a37f;
            color: white;
        }

        .primary:hover {
            background: #0d8f70;
            border-color: #0d8f70;
        }

        .disabled {
            opacity: 0.65;
            cursor: default;
        }

        .disabled:hover {
            background: #2f2f2f;
            border-color: #444;
            transform: none;
        }

        /* Downloads */

        .downloads-page h1 {
            margin-bottom: 12px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 15px;
            margin-bottom: 36px;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 500px;
            margin: 0 auto;
        }

        .download-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 60px;
        }

        .download-icon {
            font-size: 18px;
        }

        .notice {
            color: #9b9b9b;
            font-size: 14px;
            margin-top: 28px;
            line-height: 1.5;
        }

        .back-button {
            margin-top: 30px;
            background: transparent;
            border: none;
            color: #a0a0a0;
            padding: 10px 16px;
        }

        .back-button:hover {
            color: #ffffff;
            background: #2a2a2a;
        }

        /* Footer */

        footer {
            width: 100%;
            text-align: center;
            color: #777;
            font-size: 12px;
            padding: 20px;
        }

        /* Mobile */

        @media (max-width: 600px) {
            .navbar {
                padding: 0 18px;
            }

            h1 {
                font-size: 29px;
            }

            .button-container {
                grid-template-columns: 1fr;
                max-width: 420px;
            }

            main {
                padding: 30px 18px;
            }

            .icon {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Joel Interweb</div>
    </nav>

    <main>

        <!-- HOME PAGE -->
        <section id="homePage" class="page">

            <div class="icon">J</div>

            <h1>What are you here for?</h1>

            <div class="button-container">

                <button
                    class="primary"
                    onclick="showDownloads()">
                    CedarsMP
                </button>

                <button
                    class="disabled"
                    onclick="doNothing()">
                    For example, nothing
                </button>

            </div>

        </section>


        <!-- DOWNLOAD PAGE -->
        <section id="downloadsPage" class="page downloads-page hidden">

            <div class="icon">↓</div>

            <h1>Downloads</h1>

            <p class="subtitle">
                Choose the version of Joel Client you want to download.
            </p>

            <div class="download-buttons">

                <button
                    class="primary download-button"
                    onclick="downloadFolder('joelclient1.12', 'joel-client-1.12')">
                    <span class="download-icon">↓</span>
                    Joel Client 1.12
                </button>

                <button
                    class="download-button"
                    onclick="downloadFolder('joelclient.1.14', 'joel-client-1.14')">
                    <span class="download-icon">↓</span>
                    Joel Client 1.14
                </button>

            </div>

            <p class="notice">
                If you are a regular player, download 1.12
            </p>

            <button
                class="back-button"
                onclick="showHome()">
                ← Back
            </button>

        </section>

    </main>

    <footer>
        Joel Interweb
    </footer>


    <script>
        const GITHUB_API =
            "https://api.github.com/repos/sahurhub/joel/contents/Resources";

        /*
         * Switch to the downloads page.
         */
        function showDownloads() {
            document.getElementById("homePage").classList.add("hidden");
            document.getElementById("downloadsPage").classList.remove("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        /*
         * Return to the home page.
         */
        function showHome() {
            document.getElementById("downloadsPage").classList.add("hidden");
            document.getElementById("homePage").classList.remove("hidden");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        /*
         * The second button intentionally does nothing.
         */
        function doNothing() {
            // Nothing happens.
        }


        /*
         * Gets every file in the requested GitHub folder and
         * downloads them as a ZIP file.
         *
         * This means you don't need to know the individual
         * filenames inside the client folders.
         */
        async function downloadFolder(folderName, zipName) {

            const buttons = document.querySelectorAll(".download-button");

            buttons.forEach(button => {
                button.disabled = true;
            });

            const clickedButton = event.currentTarget;
            const originalText = clickedButton.innerHTML;

            clickedButton.innerHTML =
                '<span class="download-icon">⏳</span> Preparing download...';

            try {

                const response = await fetch(
                    `${GITHUB_API}/${encodeURIComponent(folderName)}`
                );

                if (!response.ok) {
                    throw new Error(
                        `GitHub returned ${response.status}`
                    );
                }

                const files = await response.json();

                if (!Array.isArray(files) || files.length === 0) {
                    throw new Error("No files were found in this folder.");
                }

                /*
                 * JSZip is loaded dynamically so the main page
                 * remains lightweight.
                 */
                if (!window.JSZip) {

                    await loadScript(
                        "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
                    );
                }

                const zip = new JSZip();

                for (const file of files) {

                    if (file.type !== "file") {
                        continue;
                    }

                    const fileResponse = await fetch(file.download_url);

                    if (!fileResponse.ok) {
                        throw new Error(
                            `Could not download ${file.name}`
                        );
                    }

                    const blob = await fileResponse.blob();

                    zip.file(file.name, blob);
                }

                const zipBlob = await zip.generateAsync({
                    type: "blob"
                });

                const url = URL.createObjectURL(zipBlob);

                const downloadLink = document.createElement("a");

                downloadLink.href = url;
                downloadLink.download = `${zipName}.zip`;

                document.body.appendChild(downloadLink);

                downloadLink.click();

                downloadLink.remove();

                URL.revokeObjectURL(url);

                clickedButton.innerHTML = originalText;

            } catch (error) {

                console.error(error);

                alert(
                    "There was a problem preparing the download.\n\n" +
                    error.message
                );

                clickedButton.innerHTML = originalText;

            } finally {

                buttons.forEach(button => {
                    button.disabled = false;
                });
            }
        }


        /*
         * Dynamically load JSZip.
         */
        function loadScript(src) {

            return new Promise((resolve, reject) => {

                const script = document.createElement("script");

                script.src = src;

                script.onload = resolve;

                script.onerror = () =>
                    reject(
                        new Error("Could not load the ZIP library.")
                    );

                document.head.appendChild(script);
            });
        }
    </script>

</body>
</html>
